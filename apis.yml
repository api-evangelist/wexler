name: Wexler
description: Wexler AI operates a Fact Intelligence Platform built for legal disputes
  and investigations. Its AI system, including an assistant named Kim, extracts, structures,
  and verifies facts across large document sets with source attribution, surfaces inconsistencies
  and contradictions in evidence, builds chronological case timelines, and produces
  confidence-scored, testable facts grounded in source materials. It is used by enterprise
  and AmLaw100 law firms for early case assessment. Wexler currently exposes no public
  developer API; this profile captures its public identity and security posture.
